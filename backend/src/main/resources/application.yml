server:
  port: 8081

spring:
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/smartbus}
    username: ${PG_USER:smartbus}
    password: ${PG_PASSWORD:SmartBus!dev2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:data-pg.sql
      continue-on-error: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Dev-only secret. Override in production via APP_JWT_SECRET env var.
    secret: ${APP_JWT_SECRET:U21hcnRCdXNEZXZTZWNyZXRLZXlGb3IyMDI2ISEhISEhISEhISEhISEhISEh}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.smartbus: INFO
