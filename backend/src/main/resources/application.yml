server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/smartbus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: smartbus
    password: SmartBus!dev2026
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Dev-only secret. Override in production via APP_JWT_SECRET env var.
    secret: ${APP_JWT_SECRET:U21hcnRCdXNEZXZTZWNyZXRLZXlGb3IyMDI2ISEhISEhISEhISEhISEhISEh}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.smartbus: INFO
